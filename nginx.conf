events {
  worker_connections 1024;
}
http {
  resolver 127.0.0.11 valid=10s;
  server {
    listen 80;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }
  server {
    listen 443 ssl;
    server_name wavecom.maryamadi.com;
    ssl_certificate /etc/letsencrypt/live/wavecom.maryamadi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wavecom.maryamadi.com/privkey.pem;
    location / {
      set $upstream_api api:3000;
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}